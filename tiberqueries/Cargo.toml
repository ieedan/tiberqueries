[package]
name = "tiberqueries"
version = "0.2.0"
edition = "2021"
authors = ["Aidan Bleser"]
description = "A lightweight ORM for Tiberius."
documentation = "https://github.com/ieedan/tiberqueries"
keywords = ["derive", "tiberius", "mssqlserver", "orm"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ieedan/tiberqueries"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The TDS driver is selected by feature. Both candidates build a library named
# `tiberius`, so each is renamed with `package = ...` to keep their extern crate
# names distinct; `lib.rs` re-exports the selected one as `tiberqueries::tiberius`.
tiberius_upstream = { package = "tiberius", version = "0.12.2", features = ["chrono"], optional = true }
tiberius_ng = { package = "tiberius-ng", version = "0.13", features = ["chrono"], optional = true }
tokio = { version = "^1.37.0", features = ["full"], optional = true }
tokio-util = { version = "0.7.10", features = ["compat"], optional = true }
tiberqueries_derive = { path = "../tiberqueries_derive", version = "0.2.0", optional = true }

[features]
default = ["derive", "query", "upstream"]
derive = ["tiberqueries_derive"]
query = ["tokio", "tokio-util"]

# Driver backends. Exactly one must be enabled.
upstream = ["dep:tiberius_upstream"]
ng = ["dep:tiberius_ng"]
