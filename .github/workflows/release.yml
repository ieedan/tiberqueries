name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags and create GitHub releases
      pull-requests: write # open the "Version Packages" PR
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Exchanges the GitHub OIDC token for a short-lived crates.io token.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
